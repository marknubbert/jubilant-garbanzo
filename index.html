<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Croftview Scavenger Hunt</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --gold: #f59e0b;
      --win: #a855f7;
    }

    body {
      margin: 0;
      padding: 1rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .header {
      text-align: center;
      padding: 1rem 0 0 0;
    }

    .header h1 {
      margin: 0;
      font-size: 1.75rem;
      color: var(--accent);
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    h2 {
      margin-top: 0;
      font-size: 1.2rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 0.5rem;
    }

    .dropdown {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #000;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .wallet-grid {
      display: grid;
      /* Made columns slightly wider to accommodate longer artifact names */
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .badge {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 0.75rem 0.5rem;
      text-align: center;
      font-size: 0.85rem;
      word-break: break-word;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0.25rem;
    }

    .badge .count {
      font-size: 1.25rem;
      font-weight: bold;
    }

    .badge.unlocked {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    .badge.locked {
      opacity: 0.6;
    }

    .leader-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .leader-row:last-child {
      border-bottom: none;
    }

    .leader-name {
      font-weight: 500;
    }

    .leader-score {
      color: var(--gold);
      font-weight: bold;
      text-align: right;
      font-size: 0.9rem;
    }

    .status-alert {
      background: #22c55e;
      color: #000;
      padding: 0.75rem;
      border-radius: 8px;
      font-weight: bold;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <canvas id="particle-canvas"></canvas>

  <div class="container">
    
    <!-- CLAIM SCREEN (Only visible when a code is scanned) -->
    <div id="claim-view" class="card" style="display: none; text-align: center; border: 2px solid var(--accent); margin-top: 1rem;">
      <h2 style="color: var(--accent); border: none; font-size: 1.5rem; padding: 0;">🎉 Code Found!</h2>
      <p style="font-size: 1.1rem; line-height: 1.4; margin-bottom: 1.5rem;">
        Welcome to the Croftview Scavenger Hunt!<br>Who found this code?
      </p>
      
      <select id="player-select" class="dropdown">
        <option value="" disabled selected>Select your name...</option>
        <!-- Options injected via JS -->
      </select>
      
      <button id="claim-btn" class="btn">Draw Artifact</button>
    </div>

    <!-- MAIN DASHBOARD (Visible normally) -->
    <div id="dashboard-view" style="display: none; display: flex; flex-direction: column; gap: 1.25rem;">
      <div class="header">
        <h1>🏡 Croftview Hunt</h1>
      </div>

      <div id="status-box" class="status-alert"></div>

      <!-- LEADERBOARD -->
      <div class="card">
        <h2>🏆 Leaderboard (First to 6 wins!)</h2>
        <div id="leaderboard-list">
          <p style="opacity:0.6; text-align: center;">Loading leaderboard...</p>
        </div>
      </div>

      <!-- WALLET VIEWER -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem;">
          <h2 style="border: none; padding: 0; margin: 0;">🎒 View Artifacts</h2>
        </div>
        <select id="wallet-select" class="dropdown" style="margin-top: 1rem; margin-bottom: 0;">
          <option value="" disabled selected>Select a player to view...</option>
          <!-- Options injected via JS -->
        </select>
        <div id="wallet-grid" class="wallet-grid">
          <!-- Badges populate dynamically -->
        </div>
      </div>
    </div>

  </div>

  <script>
    // =========================================================================
    // CONFIGURATION
    // =========================================================================
    const BIN_ID = "6a84abfcda38895dfef40243"; // NEW ARTIFACT BIN
    const API_KEY = "$2a$10$LTmQwHuXjH3CcNH3T6AJfuzPnQsrBiPqo56X.BdY.Ia7rAnPr9mXS";

    const PLAYERS = [
      "Great Granny", "David", "Kay", "Carol", "Nick", "Julie", "Andrew", 
      "Lindsey", "Tim", "Mark", "Toni", "Sally", "Tom M", "Max", "Eliza", "Tom N"
    ];

    const ARTIFACTS = [
      "Slice of Compulsory Cake", 
      "Gluten-Free Brownie", 
      "Knitting Needle", 
      "Bag of Golf Clubs", 
      "German Visa", 
      "Pre-Flight Checklist"
    ];

    // Global state to cache cloud data
    let globalCloudData = []; 

    // =========================================================================
    // INITIALIZATION
    // =========================================================================
    async function initApp() {
      populateDropdowns();

      const urlParams = new URLSearchParams(window.location.search);
      const scannedCode = urlParams.get('found');

      if (scannedCode) {
        document.getElementById('claim-view').style.display = 'block';
        document.getElementById('dashboard-view').style.display = 'none';
        document.getElementById('claim-btn').onclick = () => handleClaim(scannedCode);
      } else {
        document.getElementById('claim-view').style.display = 'none';
        document.getElementById('dashboard-view').style.display = 'flex';
        await loadAndRenderDashboard();
      }

      document.getElementById('wallet-select').addEventListener('change', (e) => {
        renderWallet(e.target.value);
      });
    }

    function populateDropdowns() {
      const claimSelect = document.getElementById('player-select');
      const walletSelect = document.getElementById('wallet-select');
      
      const sortedPlayers = [...PLAYERS].sort();

      sortedPlayers.forEach(player => {
        const opt1 = document.createElement('option');
        opt1.value = player;
        opt1.textContent = player;
        claimSelect.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = player;
        opt2.textContent = player;
        walletSelect.appendChild(opt2);
      });
    }

    // =========================================================================
    // CORE LOGIC
    // =========================================================================
    async function handleClaim(code) {
      const select = document.getElementById('player-select');
      const name = select.value;
      const btn = document.getElementById('claim-btn');

      if (!name) {
        alert("Please tell us who you are first!");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Drawing Artifact...";
      select.disabled = true;

      // 1. Fetch current cloud state
      globalCloudData = await fetchCloudData();
      
      let player = globalCloudData.find(p => p.name === name);

      if (!player) {
        player = { name: name, codes: [], artifacts: [] };
        globalCloudData.push(player);
      }
      
      // Safety check for old data structure
      if (!player.artifacts) player.artifacts = [];

      // 2. Check if they already scanned this specific QR code
      if (!player.codes.includes(code)) {
        
        // Draw a random artifact!
        const drawnArtifact = ARTIFACTS[Math.floor(Math.random() * ARTIFACTS.length)];
        
        player.codes.push(code);
        player.artifacts.push(drawnArtifact);
        
        await pushToCloud(globalCloudData);
        triggerCelebration();
        showStatus(`🎉 Awesome job! You unlocked: ${drawnArtifact}!`, "#22c55e");
        
        // Check for Win Condition
        const uniqueArtifactsCount = new Set(player.artifacts).size;
        if (uniqueArtifactsCount === ARTIFACTS.length) {
            setTimeout(() => {
                alert(`🏆 INCREDIBLE! ${name} has collected all 6 unique artifacts and won the game!`);
            }, 500);
        }

      } else {
        showStatus(`Whoops! You already found this QR code, ${name}! Find a new one to draw again.`, "#f59e0b");
      }

      // 3. Switch views
      document.getElementById('claim-view').style.display = 'none';
      document.getElementById('dashboard-view').style.display = 'flex';
      
      document.getElementById('wallet-select').value = name;
      window.history.replaceState({}, document.title, window.location.pathname);

      renderLeaderboard();
      renderWallet(name);
    }

    async function loadAndRenderDashboard() {
      globalCloudData = await fetchCloudData();
      renderLeaderboard();
      document.getElementById('wallet-grid').innerHTML = "<p style='opacity:0.6; grid-column: 1 / -1; text-align: center;'>Select a player above to see their artifacts.</p>";
    }

    function renderLeaderboard() {
      const listContainer = document.getElementById('leaderboard-list');
      
      let activePlayers = globalCloudData.filter(p => p.artifacts && p.artifacts.length > 0);
      
      // Sort: First by Unique Artifacts, then by Total Artifacts
      activePlayers.sort((a, b) => {
        const uniqueA = new Set(a.artifacts).size;
        const uniqueB = new Set(b.artifacts).size;
        if (uniqueB !== uniqueA) {
            return uniqueB - uniqueA; 
        }
        return b.artifacts.length - a.artifacts.length;
      });

      listContainer.innerHTML = "";
      if (activePlayers.length === 0) {
        listContainer.innerHTML = "<p style='opacity:0.6; text-align: center;'>No artifacts found yet. The hunt is on!</p>";
        return;
      }

      activePlayers.forEach(p => {
        const uniqueCount = new Set(p.artifacts).size;
        const totalCount = p.artifacts.length;
        
        const row = document.createElement('div');
        row.className = 'leader-row';
        row.innerHTML = `
            <span class="leader-name">${p.name} ${uniqueCount === ARTIFACTS.length ? '👑' : ''}</span>
            <span class="leader-score">${uniqueCount}/6 Unique<br><span style="font-size:0.75rem; font-weight:normal; opacity:0.8;">(${totalCount} Total)</span></span>
        `;
        listContainer.appendChild(row);
      });
    }

    function renderWallet(playerName) {
      const grid = document.getElementById('wallet-grid');
      grid.innerHTML = "";

      const player = globalCloudData.find(p => p.name === playerName);
      const playerArtifacts = player && player.artifacts ? player.artifacts : [];

      // Count how many of each artifact the player has
      const counts = {};
      playerArtifacts.forEach(art => {
          counts[art] = (counts[art] || 0) + 1;
      });

      // Display all 6 possible artifacts
      ARTIFACTS.forEach(artifact => {
        const badge = document.createElement('div');
        const count = counts[artifact] || 0;
        
        badge.className = `badge ${count > 0 ? 'unlocked' : 'locked'}`;
        
        if (count > 0) {
            badge.innerHTML = `<span class="count">${count}x</span><span style="font-size: 0.8rem">${artifact}</span>`;
        } else {
            badge.innerHTML = `<span class="count">🔒</span><span style="font-size: 0.8rem">${artifact}</span>`;
        }
        
        grid.appendChild(badge);
      });
    }

    function showStatus(message, color) {
      const statusBox = document.getElementById('status-box');
      statusBox.textContent = message;
      statusBox.style.background = color;
      statusBox.style.display = "block";
    }

    // =========================================================================
    // BACKEND (JSONBIN.IO)
    // =========================================================================
    async function fetchCloudData() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { 'X-Master-Key': API_KEY }
        });
        const data = await res.json();
        return data.record.players || [];
      } catch (err) {
        console.error("Failed to fetch cloud leaderboard:", err);
        return [];
      }
    }

    async function pushToCloud(updatedPlayers) {
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY
          },
          body: JSON.stringify({ players: updatedPlayers })
        });
      } catch (err) {
        console.error("Failed to sync to cloud:", err);
      }
    }

    // =========================================================================
    // CANVAS CELEBRATION EFFECT
    // =========================================================================
    function triggerCelebration() {
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#38bdf8', '#f59e0b', '#22c55e', '#ec4899', '#a855f7'];

      for (let i = 0; i < 80; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.5) * 12,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 6 + 3,
          alpha: 1
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let activeParticles = 0;

        particles.forEach(p => {
          if (p.alpha > 0) {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.15; 
            p.alpha -= 0.015;

            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            activeParticles++;
          }
        });

        if (activeParticles > 0) {
          requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      animate();
    }

    // Run app on page load
    initApp();
  </script>
</body>
</html>
