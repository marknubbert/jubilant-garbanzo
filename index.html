<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Croftview Scavenger Hunt</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --gold: #f59e0b;
      --win: #a855f7;
      --action: #ef4444;
    }

    body {
      margin: 0;
      padding: 1rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      padding-bottom: 2rem;
    }

    .header {
      text-align: center;
      padding: 1rem 0 0 0;
    }

    .header h1 {
      margin: 0;
      font-size: 1.75rem;
      color: var(--accent);
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    h2 {
      margin-top: 0;
      font-size: 1.2rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 0.5rem;
    }

    h3 {
      font-size: 1rem;
      color: #94a3b8;
      margin: 1rem 0 0.5rem 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .dropdown {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #000;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .wallet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.75rem;
    }

    .badge {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 0.75rem 0.5rem;
      text-align: center;
      word-break: break-word;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0.25rem;
    }

    .badge .icon {
      font-size: 2rem;
      margin-bottom: 0.25rem;
    }

    .badge .count {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .badge .title {
      font-size: 0.8rem;
      line-height: 1.1;
    }

    /* Styles for progress states */
    .badge.completed {
      background: rgba(34, 197, 94, 0.15);
      border-color: #22c55e;
      color: #22c55e;
    }
    
    .badge.partial {
      background: rgba(245, 158, 11, 0.15);
      border-color: var(--gold);
      color: var(--gold);
    }

    .badge.locked {
      opacity: 0.5;
      filter: grayscale(100%);
    }

    .badge.action-item {
      background: rgba(239, 68, 68, 0.15);
      border-color: var(--action);
      color: #fca5a5;
    }

    .leader-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .leader-row:last-child { border-bottom: none; }
    .leader-name { font-weight: 500; }
    
    .leader-score {
      color: var(--gold);
      font-weight: bold;
      text-align: right;
      font-size: 0.9rem;
    }

    .status-alert {
      background: #22c55e;
      color: #000;
      padding: 0.75rem;
      border-radius: 8px;
      font-weight: bold;
      text-align: center;
      display: none;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <canvas id="particle-canvas"></canvas>

  <div class="container">
    
    <!-- CLAIM SCREEN -->
    <div id="claim-view" class="card" style="display: none; text-align: center; border: 2px solid var(--accent); margin-top: 1rem;">
      <h2 style="color: var(--accent); border: none; font-size: 1.5rem; padding: 0;">🎉 Code Found!</h2>
      <p style="font-size: 1.1rem; line-height: 1.4; margin-bottom: 1.5rem;">
        Welcome to the Croftview Scavenger Hunt!<br>Who found this code?
      </p>
      
      <select id="player-select" class="dropdown">
        <option value="" disabled selected>Select your name...</option>
      </select>
      
      <button id="claim-btn" class="btn">Draw Item(s)!</button>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard-view" style="display: none; display: flex; flex-direction: column; gap: 1.25rem;">
      <div class="header">
        <h1>🏡 Croftview Hunt</h1>
      </div>

      <div id="status-box" class="status-alert"></div>

      <!-- LEADERBOARD -->
      <div class="card">
        <h2>🏆 Leaderboard (First to 12 wins!)</h2>
        <div id="leaderboard-list">
          <p style="opacity:0.6; text-align: center;">Loading leaderboard...</p>
        </div>
      </div>

      <!-- WALLET VIEWER -->
      <div class="card">
        <h2 style="border: none; padding: 0; margin: 0;">🎒 View Wallet</h2>
        
        <select id="wallet-select" class="dropdown" style="margin-top: 1rem; margin-bottom: 0;">
          <option value="" disabled selected>Select a player to view...</option>
        </select>
        
        <!-- Artifacts Grid -->
        <h3 id="artifacts-header" style="display:none;">Required Artifacts</h3>
        <div id="wallet-grid-artifacts" class="wallet-grid"></div>

        <!-- Action Items Grid -->
        <h3 id="actions-header" style="display:none;">Action Items</h3>
        <div id="wallet-grid-actions" class="wallet-grid"></div>
      </div>
    </div>

  </div>

  <script>
    // =========================================================================
    // CONFIGURATION
    // =========================================================================
    const BIN_ID = "6a84abfcda38895dfef40243";
    const API_KEY = "$2a$10$LTmQwHuXjH3CcNH3T6AJfuzPnQsrBiPqo56X.BdY.Ia7rAnPr9mXS";

    const PLAYERS = [
      "Great Granny", "David", "Kay", "Carol", "Nick", "Julie", "Andrew", 
      "Lindsey", "Tim", "Mark", "Toni", "Sally", "Tom M", "Max", "Eliza", "Tom N"
    ];

    // Generate codes "1" through "20"
    const ALL_CODES = Array.from({length: 20}, (_, i) => (i + 1).toString());

    // Master Item Dictionary with Drop Rates and Requirements
    const ITEMS = {
      // Artifacts (Required to win)
      "Slice of Compulsory Cake": { type: "artifact", req: 4, chance: 30, icon: "🍰" },
      "Gluten-Free Brownie":      { type: "artifact", req: 3, chance: 20, icon: "🟫" },
      "Knitting Needle":          { type: "artifact", req: 2, chance: 15, icon: "🧶" },
      "Bag of Golf Clubs":        { type: "artifact", req: 1, chance: 5,  icon: "⛳" },
      "German Visa":              { type: "artifact", req: 1, chance: 5,  icon: "🛂" },
      "Pre-Flight Checklist":     { type: "artifact", req: 1, chance: 5,  icon: "📋" },
      
      // Action Items (Extra tools)
      "Trade Token":              { type: "action", chance: 15, icon: "🤝" },
      "Hand of God":              { type: "action", chance: 5,  icon: "⚡" }
    };

    const TOTAL_REQUIRED_TO_WIN = 12;
    let globalCloudData = []; 

    // =========================================================================
    // INITIALIZATION
    // =========================================================================
    async function initApp() {
      populateDropdowns();

      const urlParams = new URLSearchParams(window.location.search);
      const scannedCode = urlParams.get('found');

      if (scannedCode) {
        document.getElementById('claim-view').style.display = 'block';
        document.getElementById('dashboard-view').style.display = 'none';
        document.getElementById('claim-btn').onclick = () => handleClaim(scannedCode);
      } else {
        document.getElementById('claim-view').style.display = 'none';
        document.getElementById('dashboard-view').style.display = 'flex';
        await loadAndRenderDashboard();
      }

      document.getElementById('wallet-select').addEventListener('change', (e) => {
        renderWallet(e.target.value);
      });
    }

    function populateDropdowns() {
      const claimSelect = document.getElementById('player-select');
      const walletSelect = document.getElementById('wallet-select');
      const sortedPlayers = [...PLAYERS].sort();

      sortedPlayers.forEach(player => {
        claimSelect.appendChild(new Option(player, player));
        walletSelect.appendChild(new Option(player, player));
      });
    }

    // =========================================================================
    // CORE LOGIC & DRAWING
    // =========================================================================
    function drawRandomItem() {
      const rand = Math.random() * 100;
      let cumulative = 0;
      for (const [name, data] of Object.entries(ITEMS)) {
        cumulative += data.chance;
        if (rand <= cumulative) return name;
      }
      return "Slice of Compulsory Cake"; // Failsafe
    }

    function calculatePlayerProgress(playerArtifacts) {
      if (!playerArtifacts) return 0;
      let counts = {};
      playerArtifacts.forEach(item => counts[item] = (counts[item] || 0) + 1);
      
      let progress = 0;
      for (const [name, data] of Object.entries(ITEMS)) {
        if (data.type === 'artifact') {
           progress += Math.min(counts[name] || 0, data.req); // Cap at requirement max
        }
      }
      return progress;
    }

    async function handleClaim(code) {
      const select = document.getElementById('player-select');
      const name = select.value;
      const btn = document.getElementById('claim-btn');

      if (!name) { alert("Please tell us who you are first!"); return; }

      btn.disabled = true;
      btn.textContent = "Drawing...";
      select.disabled = true;

      globalCloudData = await fetchCloudData();
      let player = globalCloudData.find(p => p.name === name);

      if (!player) {
        player = { name: name, codes: [], artifacts: [] };
        globalCloudData.push(player);
      }
      if (!player.artifacts) player.artifacts = [];

      if (!player.codes.includes(code)) {
        
        // Check if this is their very first scan
        const isFirstScan = player.codes.length === 0;
        const numberOfDraws = isFirstScan ? 3 : 1;
        
        const drawnItems = [];
        for(let i = 0; i < numberOfDraws; i++) {
            drawnItems.push(drawRandomItem());
        }
        
        player.codes.push(code);
        player.artifacts.push(...drawnItems);
        
        await pushToCloud(globalCloudData);
        triggerCelebration();

        // Format nice alert message
        const visualItems = drawnItems.map(item => `${ITEMS[item].icon} ${item}`).join(', ');
        const introText = isFirstScan ? "🎉 FIRST SCAN BONUS! You drew 3 items:<br>" : "🎉 You found a code and drew:<br>";
        showStatus(`${introText} ${visualItems}`, "#22c55e");
        
        // Check Win Condition
        const currentProgress = calculatePlayerProgress(player.artifacts);
        if (currentProgress === TOTAL_REQUIRED_TO_WIN) {
            setTimeout(() => {
                alert(`🏆 INCREDIBLE! ${name} has collected all 12 required artifacts and WON THE GAME!`);
            }, 500);
        }

      } else {
        showStatus(`Whoops! You already claimed Code ${code}, ${name}! Find a new one to draw again.`, "#f59e0b");
      }

      // Switch views and clean URL
      document.getElementById('claim-view').style.display = 'none';
      document.getElementById('dashboard-view').style.display = 'flex';
      document.getElementById('wallet-select').value = name;
      window.history.replaceState({}, document.title, window.location.pathname);

      renderLeaderboard();
      renderWallet(name);
    }

    async function loadAndRenderDashboard() {
      globalCloudData = await fetchCloudData();
      renderLeaderboard();
    }

    function renderLeaderboard() {
      const listContainer = document.getElementById('leaderboard-list');
      let activePlayers = globalCloudData.filter(p => p.artifacts && p.artifacts.length > 0);
      
      // Sort by valid progress first, then by total items held
      activePlayers.sort((a, b) => {
        const progA = calculatePlayerProgress(a.artifacts);
        const progB = calculatePlayerProgress(b.artifacts);
        if (progB !== progA) return progB - progA; 
        return b.artifacts.length - a.artifacts.length;
      });

      listContainer.innerHTML = "";
      if (activePlayers.length === 0) {
        listContainer.innerHTML = "<p style='opacity:0.6; text-align: center;'>No codes found yet!</p>";
        return;
      }

      activePlayers.forEach(p => {
        const progress = calculatePlayerProgress(p.artifacts);
        
        const row = document.createElement('div');
        row.className = 'leader-row';
        row.innerHTML = `
            <span class="leader-name">${p.name} ${progress === TOTAL_REQUIRED_TO_WIN ? '👑' : ''}</span>
            <span class="leader-score">${progress}/12 Required<br>
            <span style="font-size:0.75rem; font-weight:normal; opacity:0.8;">(${p.codes.length} Codes Scanned)</span></span>
        `;
        listContainer.appendChild(row);
      });
    }

    function renderWallet(playerName) {
      const artGrid = document.getElementById('wallet-grid-artifacts');
      const actGrid = document.getElementById('wallet-grid-actions');
      document.getElementById('artifacts-header').style.display = 'block';
      document.getElementById('actions-header').style.display = 'block';
      
      artGrid.innerHTML = "";
      actGrid.innerHTML = "";

      const player = globalCloudData.find(p => p.name === playerName);
      const playerArtifacts = player && player.artifacts ? player.artifacts : [];

      const counts = {};
      playerArtifacts.forEach(art => counts[art] = (counts[art] || 0) + 1);

      for (const [itemName, data] of Object.entries(ITEMS)) {
        const count = counts[itemName] || 0;
        const badge = document.createElement('div');
        
        if (data.type === 'artifact') {
            // ARTIFACT LOGIC
            let statusClass = 'locked';
            if (count >= data.req) statusClass = 'completed';
            else if (count > 0) statusClass = 'partial';

            badge.className = `badge ${statusClass}`;
            badge.innerHTML = `
                <span class="icon">${data.icon}</span>
                <span class="count">${count}/${data.req}</span>
                <span class="title">${itemName}</span>
            `;
            artGrid.appendChild(badge);
        } else {
            // ACTION ITEM LOGIC
            if (count > 0) {
                badge.className = `badge action-item`;
                badge.innerHTML = `
                    <span class="icon">${data.icon}</span>
                    <span class="count">${count}x</span>
                    <span class="title">${itemName}</span>
                `;
                actGrid.appendChild(badge);
            }
        }
      }

      // If no action items, show a placeholder
      if (actGrid.innerHTML === "") {
          actGrid.innerHTML = "<p style='font-size: 0.85rem; opacity: 0.6;'>No action items found yet.</p>";
      }
    }

    function showStatus(message, color) {
      const statusBox = document.getElementById('status-box');
      statusBox.innerHTML = message;
      statusBox.style.background = color;
      statusBox.style.display = "block";
    }

    // =========================================================================
    // BACKEND (JSONBIN.IO)
    // =========================================================================
    async function fetchCloudData() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { 'X-Master-Key': API_KEY }
        });
        const data = await res.json();
        return data.record.players || [];
      } catch (err) {
        console.error("Failed to fetch cloud leaderboard:", err);
        return [];
      }
    }

    async function pushToCloud(updatedPlayers) {
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY
          },
          body: JSON.stringify({ players: updatedPlayers })
        });
      } catch (err) {
        console.error("Failed to sync to cloud:", err);
      }
    }

    // =========================================================================
    // CANVAS CELEBRATION EFFECT
    // =========================================================================
    function triggerCelebration() {
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#38bdf8', '#f59e0b', '#22c55e', '#ec4899', '#a855f7'];

      for (let i = 0; i < 80; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.5) * 12,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 6 + 3,
          alpha: 1
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let activeParticles = 0;

        particles.forEach(p => {
          if (p.alpha > 0) {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.15; 
            p.alpha -= 0.015;

            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            activeParticles++;
          }
        });

        if (activeParticles > 0) {
          requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      animate();
    }

    initApp();
  </script>
</body>
</html>
